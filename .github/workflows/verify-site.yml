name: Vérifier le site
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le JavaScript et les éléments interactifs
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          const js=html.match(/<script>([\s\S]*?)<\/script>/)?.[1];
          if(!js)throw Error('Script manquant');
          new vm.Script(js);
          const ids=[...html.matchAll(/id="([^"]+)"/g)].map(x=>x[1]);
          for(const id of ['monthPrev','monthNext','monthNow','calendar','quickDone','quickRest','prev','next','today','expressPlay','expressPause','expressReset','coachPlay','coachPause','coachRestart','export','import']){
            if(!ids.includes(id))throw Error('Élément manquant: '+id);
          }
          if(new Set(ids).size!==ids.length)throw Error('Identifiants HTML en double');
          console.log('Syntaxe JS valide; boutons et calendriers présents.');
          NODE