name: Vérifier le site
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier syntaxe JavaScript et identifiants
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          const js=html.match(/<script>([\s\S]*?)<\/script>/)?.[1];
          if(!js)throw Error('Script manquant');
          new vm.Script(js);
          const ids=[...html.matchAll(/id="([^"]+)"/g)].map(x=>x[1]);
          if(new Set(ids).size!==ids.length)throw Error('Identifiants HTML en double');
          console.log('Syntaxe et identifiants OK');
          NODE
      - name: Installer navigateur de test
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Tester le site en navigateur mobile
        run: |
          python3 -m http.server 8765 >/tmp/site.log 2>&1 &
          node tests/smoke.cjs
